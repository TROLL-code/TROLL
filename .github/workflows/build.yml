name: Build TROLL (Cross-Platform)
on:
  pull_request:
    branches: [ "dev" ]  # Run when a PR targets the `dev` branch
  push:
    branches: [ "dev" ]  # Run when a commit is pushed directly to `dev`
  workflow_dispatch:  # Allows manual triggering

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake libgsl-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install gsl   # cmake already installed on macos-latest

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Verify executable (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: ls -lh build/TROLL
